<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>온보딩</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <link rel="stylesheet" href="style.css">
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', 'sans-serif'] },
          colors: { primary: '#000000', brand: '#10B981', cardBg: '#EEEEEE' }
        }
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // 온보딩 전용 헤더 (상태바 + 뒤로가기 + 프로그레스 바)
    const OnboardingHeader = ({ onBack, step }) => (
      <div className="bg-white sticky top-0 z-10 flex flex-col">
        <StatusBar />
        <div className="flex items-center justify-between px-4 py-3 relative h-12">
          {step > 1 ? (
            <button onClick={onBack} className="text-black p-2 z-10 active:opacity-50">
              <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7"></path></svg>
            </button>
          ) : <div className="w-10"></div>}
        </div>
        
        {/* 진행률 바 */}
        <div className="flex px-7 gap-2 pb-4">
          {[1, 2, 3, 4].map(num => (
            <div key={num} className={`h-1 flex-1 rounded-full ${step >= num ? 'bg-black' : 'bg-[#EEEEEE]'}`} />
          ))}
        </div>
      </div>
    );

    // 스크린 1: 목표 선택
    const Screen1 = ({ onNext }) => {
      const options = [
        { icon: "🎯", title: "목표를 위해 달릴래요", desc: "사고 싶은 물건이나 가고 싶은 여행지가 있어요." },
        { icon: "💰", title: "든든한 잔고가 최고", desc: "특별한 목적보다는 꾸준히 저축해서\n시드머니를 모으고 싶어요." },
        { icon: "🛑", title: "새는 돈부터 막기", desc: "당장의 큰 목표보다는,\n지금 엉망인 소비 습관을 고치고 싶어요." },
        { icon: "👀", title: "내 소비 패턴 구경하기", desc: "일단 내가 어디에 돈을 제일 많이 쓰는지\n팩트부터 가볍게 보고 싶어요" },
      ];

      return (
        <div className="fade-in px-7 pb-8">
          <h2 className="text-[20px] font-bold text-center mt-6 mb-12 leading-[24px]">반가워요!<br/>우리, 어떤 목표를 향해 함께 가볼까요?</h2>
          <div className="flex flex-col gap-[18px]">
            {options.map((opt, idx) => (
              <button key={idx} onClick={onNext} className="relative w-full h-[111px] bg-[#EEEEEE] rounded-lg shadow-[0_0_4px_rgba(0,0,0,0.25)] flex items-center px-6 active:scale-[0.98] transition-transform text-left">
                <span className="text-[48px] leading-[57px] absolute left-[30px]">{opt.icon}</span>
                <div className="absolute left-[110px] w-[200px]">
                  <h3 className="font-bold text-[20px] leading-[24px] text-black mb-1">{opt.title}</h3>
                  <p className="font-normal text-[10px] leading-[12px] text-black whitespace-pre-line">{opt.desc}</p>
                </div>
              </button>
            ))}
          </div>
        </div>
      );
    };

    // 스크린 2: 목표 상세 설정
    const Screen2 = ({ onNext }) => {
      return (
        <div className="fade-in px-7 pb-8 flex flex-col h-[calc(100%-20px)]">
          <h2 className="text-[20px] font-bold text-center mt-6 mb-12 leading-[24px]">반가워요!<br/>우리, 어떤 목표를 향해 함께 가볼까요?</h2>
          
          <div className="flex-1">
            {/* 이미지 업로드 */}
            <div className="w-full aspect-[4/3] bg-[#EEEEEE] rounded-lg shadow-[0_0_4px_rgba(0,0,0,0.1)] flex flex-col items-center justify-center text-gray-500 mb-8 cursor-pointer hover:bg-gray-200 transition">
              <svg className="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
              <span className="text-[12px] font-medium">목표 이미지 업로드</span>
            </div>

            {/* 입력 폼 */}
            <div className="space-y-6">
              <div>
                <label className="block text-[14px] font-bold text-black mb-2">목표 타이틀</label>
                <input type="text" placeholder="예: 닌텐도 스위치 구매하기" className="w-full p-4 rounded-lg border border-gray-300 focus:outline-none focus:border-black text-[14px]" />
              </div>
              <div>
                <label className="block text-[14px] font-bold text-black mb-2">목표 금액</label>
                <div className="relative">
                  <input type="text" placeholder="1,000,000" className="w-full p-4 rounded-lg border border-gray-300 focus:outline-none focus:border-black text-[14px] pr-12 text-right font-bold" />
                  <span className="absolute right-4 top-1/2 -translate-y-1/2 text-black text-[14px] font-bold">원</span>
                </div>
              </div>
            </div>
          </div>

          <button onClick={onNext} className="w-full bg-[#EEEEEE] text-black font-bold py-4 rounded-lg mt-8 shadow-[0_0_4px_rgba(0,0,0,0.25)] hover:bg-gray-200 active:scale-[0.98] transition">
            등록하기
          </button>
        </div>
      );
    };

    // 스크린 3: 7가지 소비 스타일 파악 (스와이프 퀴즈)
    const Screen3 = ({ onNext }) => {
      const consumptionStyles = [
        { tag: "#스트레스_폭발", desc: "화나거나 우울할 때 나도 모르게 배달 앱이나 쇼핑 앱을 켜게 돼요." },
        { tag: "#새벽감성_쇼핑", desc: "밤 11시만 넘으면 왠지 마음이 허전해서 이것저것 장바구니에 담아요." },
        { tag: "#티끌모아_태산", desc: "큰 걸 사진 않는데, 택시비나 커피값 같은 자잘한 지출이 모여서 텅장이 돼요." },
        { tag: "#선결제_후수습", desc: "사고 싶은 건 일단 긁고 봐요. 수습은 다음 달의 나에게 맡기는 편이에요." },
        { tag: "#할인/품절임박_노예", desc: "'오늘만 이 가격', '마감 임박' 알림을 보면 안 사면 손해 보는 것 같아요." },
        { tag: "#트렌드_탑승객", desc: "남들이 다 사는 핫템이나 SNS에서 유행하는 건 나도 꼭 사야 직성이 풀려요." },
        { tag: "#나에게_주는_선물", desc: "오늘 하루 고생했으니까, 이 정도는 나를 위해 써도 된다는 보상 심리가 커요." }
      ];

      const [currentIndex, setCurrentIndex] = useState(0);
      const [isAnimating, setIsAnimating] = useState(false);

      const handleAnswer = () => {
        if (isAnimating) return;
        setIsAnimating(true);
        
        setTimeout(() => {
          if (currentIndex < 6) { // 7개 카드 모두 진행
            setCurrentIndex(prev => prev + 1);
            setIsAnimating(false);
          } else {
            onNext();
          }
        }, 300); // swipeLeft 애니메이션 대기
      };

      const currentCard = consumptionStyles[currentIndex];

      return (
        <div className="fade-in px-7 pb-8 flex flex-col h-full overflow-hidden">
          <div className="text-center mt-6 mb-12">
            <h2 className="text-[20px] font-bold mb-2">당신의 소비 스타일을 알려주세요</h2>
            <p className="text-[12px] text-gray-500">({currentIndex + 1} / 7) 해당하는 항목에 YES를 눌러주세요.</p>
          </div>

          <div className="flex-1 flex items-center justify-center relative">
            {/* 스택 느낌을 위한 배경 더미 카드 */}
            <div className="absolute w-full max-w-[300px] h-[380px] bg-white rounded-2xl shadow-md border border-gray-200 -bottom-2 z-0 translate-y-4 scale-[0.93]"></div>
            <div className="absolute w-full max-w-[300px] h-[380px] bg-white rounded-2xl shadow-md border border-gray-200 -bottom-6 z-0 translate-y-8 scale-[0.86]"></div>
            
            {/* 현재 카드 */}
            <div className={`w-full max-w-[320px] bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.12)] p-6 border border-gray-100 flex flex-col relative z-10 ${isAnimating ? 'card-swipe' : ''}`}>
              <div className="w-full aspect-[4/3] bg-[#EEEEEE] rounded-xl mb-6 shadow-inner flex items-center justify-center text-gray-400">
                <span className="text-4xl">📸</span>
              </div>
              <h3 className="text-[22px] font-bold text-black mb-3">{currentCard.tag}</h3>
              <p className="text-[14px] text-gray-700 leading-relaxed mb-8 h-[60px]">"{currentCard.desc}"</p>
              
              <div className="flex gap-3 mt-auto">
                <button onClick={handleAnswer} className="flex-1 py-4 rounded-xl bg-gray-100 text-gray-600 font-bold hover:bg-gray-200 active:scale-95 transition">NO</button>
                <button onClick={handleAnswer} className="flex-1 py-4 rounded-xl bg-black text-white font-bold hover:bg-gray-800 active:scale-95 transition">YES</button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // 스크린 4: 결과 프로필
    const Screen4 = ({ onComplete }) => {
      return (
        <div className="fade-in px-7 pb-8 flex flex-col h-full items-center justify-center text-center">
          <div className="flex-1 flex flex-col items-center justify-center w-full">
            <div className="w-20 h-20 bg-[#EEEEEE] rounded-full flex items-center justify-center mb-6 shadow-sm">
              <span className="text-3xl">🎉</span>
            </div>
            {/* 이미지 기준에 맞추어 이름 적용 */}
            <h2 className="text-[24px] font-bold mb-2">성공! 지수님의<br/>소비 프로필</h2>
            <p className="text-[13px] text-gray-500 mb-10">분석을 완료했습니다. 앞으로 함께 목표를 달성해봐요!</p>

            <div className="w-full bg-[#EEEEEE] rounded-xl p-6 text-left shadow-[0_0_4px_rgba(0,0,0,0.25)]">
              <div className="flex items-center gap-2 mb-3">
                <span className="text-xl">🌊</span>
                <h3 className="text-[16px] font-bold text-black">감정 소비형</h3>
              </div>
              <p className="text-[12px] text-black leading-relaxed">
                스트레스 지수가 높을 때 충동적으로 소비하는 경향이 있으시군요! 이번 목표를 통해 소비와 감정을 분리하는 연습을 시작해볼까요?
              </p>
            </div>
          </div>

          <button onClick={onComplete} className="w-full bg-black text-white font-bold py-4 rounded-lg mt-8 active:scale-[0.98] transition shadow-lg">
            시작하기
          </button>
        </div>
      );
    };

    // 앱 컨트롤러
    const OnboardingApp = () => {
      const [step, setStep] = useState(1);

      const handleComplete = () => {
        // 모든 튜토리얼 완료 후 home.html로 이동
        window.location.href = 'home.html';
      };

      return (
        <div className="device-mockup">
          <OnboardingHeader step={step} onBack={() => setStep(step - 1)} />
          
          <div className="app-content">
            {step === 1 && <Screen1 onNext={() => setStep(2)} />}
            {step === 2 && <Screen2 onNext={() => setStep(3)} />}
            {step === 3 && <Screen3 onNext={() => setStep(4)} />}
            {step === 4 && <Screen4 onComplete={handleComplete} />}
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<OnboardingApp />);
  </script>
</body>
</html>
