<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>소비기록</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <link rel="stylesheet" href="style.css">
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', 'sans-serif'] },
          colors: { primary: '#000000', brand: '#10B981', cardBg: '#EEEEEE' }
        }
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components.js"></script>

  <script type="text/babel">
    const { useState } = React;

    const HistoryApp = () => {
      const [currentMonth, setCurrentMonth] = useState(4);

      // 소비 기록 더미 데이터 (이미지 기반)
      const historyData = [
        {
          id: 1,
          date: "4월 18일",
          total: "57,300원",
          items: [
            { mood: "🤯", desc: "-7,500원 | 택시", evalIcon: "👎", evalText: "후회" },
            { mood: "🤤", desc: "-32,600원 | 우아한형제들", evalIcon: "👍", evalText: "만족" },
            { mood: "😐", desc: "-3,030원 | 홍익문화사", evalIcon: "👍", evalText: "만족" }
          ]
        },
        {
          id: 2,
          date: "4월 17일",
          total: "65,230원",
          items: [
            { mood: "🤯", desc: "-15,500원 | 택시", evalIcon: "👎", evalText: "후회" },
            { mood: "🤤", desc: "-32,600원 | 우아한형제들", evalIcon: "👍", evalText: "만족" },
            { mood: "😐", desc: "-3,030원 | 홍익문화사", evalIcon: "👍", evalText: "만족" },
            { mood: "🤤", desc: "-11,100원 | 커피빈", evalIcon: "👍", evalText: "만족" },
            { mood: "😐", desc: "-3,000원 | 다이소", evalIcon: "👍", evalText: "만족" }
          ]
        },
        {
          id: 3,
          date: "4월 16일",
          total: "145,400원",
          items: [
            { mood: "🤯", desc: "-92,100원 | 올리브영", evalIcon: "👎", evalText: "후회" },
            { mood: "🤤", desc: "-53,300원 | 무신사", evalIcon: "👍", evalText: "만족" }
          ]
        }
      ];

      return (
        <div className="device-mockup">
          
          {/* 상단 고정 헤더 */}
          <div className="sticky top-0 z-40 bg-white">
            <StatusBar />
            <div className="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
              <h1 className="text-[22px] font-bold text-black">소비기록</h1>
            </div>
          </div>

          {/* 스크롤 가능한 본문 영역 */}
          <div className="app-content pb-[100px] bg-white relative">
            
            {/* 월 선택기 */}
            <div className="px-8 pt-6 pb-4 flex items-center gap-3">
              <button onClick={() => setCurrentMonth(prev => prev - 1)} className="text-gray-400 hover:text-black active:scale-90 transition">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
              </button>
              <span className="text-[16px] font-bold text-black">{currentMonth}월</span>
              <button onClick={() => setCurrentMonth(prev => prev + 1)} className="text-gray-200 hover:text-black active:scale-90 transition">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
              </button>
            </div>

            {/* 타임라인 영역 */}
            <div className="relative mt-2">
              {/* 왼쪽을 관통하는 세로선 */}
              <div className="absolute left-[41px] top-2 bottom-0 w-[2px] bg-[#D9D9D9] z-0"></div>

              {historyData.map((data, index) => (
                <div key={data.id} className="relative z-10 mb-10 fade-in" style={{ animationDelay: `${index * 0.1}s` }}>
                  
                  {/* 날짜 헤더 (동그라미 + 날짜 + 총액) */}
                  <div className="flex items-center mb-5">
                    {/* 타임라인 동그라미 노드 */}
                    <div className="absolute left-[35px] w-[14px] h-[14px] rounded-full bg-[#D9D9D9] flex items-center justify-center">
                      <div className="w-[8px] h-[8px] rounded-full bg-[#B7B7B7]"></div>
                    </div>
                    
                    <div className="ml-[64px] flex items-baseline gap-2">
                      <span className="text-[12px] text-gray-500">{data.date}</span>
                      <span className="text-[14px] font-bold text-black">{data.total}</span>
                    </div>
                  </div>

                  {/* 세부 결제 내역 리스트 */}
                  <div className="ml-[64px] space-y-6 pr-6">
                    {data.items.map((item, idx) => (
                      <div key={idx} className="flex items-center justify-between w-full">
                        <div className="flex items-center gap-3">
                          <span className="text-[20px] filter drop-shadow-sm leading-none">{item.mood}</span>
                          <span className="text-[14px] text-black tracking-tight">{item.desc}</span>
                        </div>
                        <div className="flex items-center gap-1 text-[12px] text-gray-500 font-medium">
                          <span className="text-[14px] leading-none opacity-80">{item.evalIcon}</span>
                          {item.evalText}
                        </div>
                      </div>
                    ))}
                  </div>
                  
                </div>
              ))}
            </div>

          </div>

          {/* 하단 네비게이션 (history 탭 활성화) */}
          <BottomNav active="history" />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HistoryApp />);
  </script>
</body>
</html>
