<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>소비기록</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <link rel="stylesheet" href="style.css">
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', 'sans-serif'] },
          colors: { primary: '#000000', brand: '#10B981', cardBg: '#EEEEEE' }
        }
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components.js"></script>

  <script type="text/babel">
    const { useState } = React;

    const HistoryApp = () => {
      // 뷰 모드 상태: 'emoji' (이모지 캘린더) or 'list' (정기 지출 캘린더)
      const [viewMode, setViewMode] = useState('emoji');
      // 선택된 날짜 상태 (기본 16일)
      const [selectedDate, setSelectedDate] = useState(16);

      // 2026년 4월 달력 데이터 (수요일 시작)
      const daysInMonth = Array.from({ length: 30 }, (_, i) => i + 1);
      const emptyDays = [null, null]; // 월, 화 빈칸

      // 이모지 데이터 매핑
      const emojiData = {
        1: '😍', 5: '😡', 11: '😭', 14: '😍', 16: '🤯'
      };

      // 16일 상세 소비 내역
      const dailyTransactions = [
        { time: '23:48', name: '올리브영', amount: '-92,100원' },
        { time: '19:34', name: '홍익문화사 (포스터 인쇄)', amount: '-28,000원' },
        { time: '18:12', name: '아두이노 센서 모듈', amount: '-15,500원' },
        { time: '15:18', name: '성수동 카페', amount: '-24,800원' }
      ];

      // 정기적 지출 예상 데이터
      const subscriptions = [
        { name: 'Netflix', amount: '13,500원' },
        { name: 'YouTube Premium', amount: '14,900원' },
        { name: 'TouchDesigner 구독', amount: '35,000원' },
        { name: 'Adobe CC', amount: '23,100원' }
      ];

      return (
        <div className="device-mockup">
          
          {/* 상단 헤더 영역 */}
          <div className="sticky top-0 z-40 bg-white">
            <StatusBar />
            <div className="px-4 py-3 flex items-center border-b border-gray-100">
              <button className="p-2 active:opacity-50">
                <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7"></path></svg>
              </button>
              <h1 className="text-[16px] font-bold ml-2">CALENDAR</h1>
            </div>
          </div>

          {/* 스크롤 가능한 본문 영역 */}
          <div className="app-content p-6 pb-[100px] bg-[#FAFAFA]">
            
            {/* 캘린더 상단 컨트롤 */}
            <div className="flex justify-between items-end mb-4">
              <div>
                <span className="text-[10px] font-bold text-gray-400 block mb-0.5">2026</span>
                <div className="flex items-center gap-1 cursor-pointer">
                  <h2 className="text-[20px] font-bold leading-none">April</h2>
                  <svg className="w-4 h-4 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
                </div>
              </div>
              
              {/* 토글 버튼 그룹 */}
              <div className="flex gap-2">
                <button 
                  onClick={() => setViewMode('emoji')}
                  className={`w-9 h-9 rounded-lg flex items-center justify-center transition ${viewMode === 'emoji' ? 'bg-[#333333] text-white shadow-md' : 'bg-white border border-gray-200 text-gray-400'}`}
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </button>
                <button 
                  onClick={() => setViewMode('list')}
                  className={`w-9 h-9 rounded-lg flex items-center justify-center transition ${viewMode === 'list' ? 'bg-[#333333] text-white shadow-md' : 'bg-white border border-gray-200 text-gray-400'}`}
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                </button>
              </div>
            </div>

            {/* 캘린더 카드 영역 */}
            <div className="bg-white rounded-2xl p-5 shadow-[0_4px_20px_rgba(0,0,0,0.04)] border border-gray-100 mb-8">
              {/* 요일 헤더 */}
              <div className="grid grid-cols-7 text-center mb-4">
                {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(day => (
                  <span key={day} className="text-[10px] text-gray-400 font-medium">{day}</span>
                ))}
              </div>

              {/* 날짜 그리드 */}
              <div className="grid grid-cols-7 gap-y-4 text-center">
                {emptyDays.map((_, i) => <div key={`empty-${i}`}></div>)}
                
                {daysInMonth.map(date => {
                  const isSelected = selectedDate === date;
                  const hasEmoji = viewMode === 'emoji' && emojiData[date];
                  const hasUnderline = viewMode === 'list' && [2, 16, 23, 25, 21].includes(date);

                  return (
                    <div 
                      key={date} 
                      onClick={() => setSelectedDate(date)}
                      className="relative flex flex-col items-center justify-center h-10 cursor-pointer"
                    >
                      {/* 선택된 날짜 원형 배경 */}
                      {isSelected && <div className="absolute inset-0 bg-[#EEEEEE] rounded-full mx-auto w-8 h-8 z-0"></div>}
                      
                      {/* 날짜 텍스트 */}
                      <span className={`relative z-10 text-[13px] ${isSelected ? 'font-bold text-black' : 'text-gray-700'}`}>
                        {date}
                      </span>
                      
                      {/* 이모지 표시 */}
                      {hasEmoji && (
                        <div className="absolute -bottom-1 right-1 z-20 text-[14px] leading-none filter drop-shadow-sm">
                          {emojiData[date]}
                        </div>
                      )}

                      {/* 리스트 모드 밑줄 표시 */}
                      {hasUnderline && (
                        <div className="absolute bottom-1 w-4 h-[2px] bg-red-400 rounded-full z-10"></div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* 하단 상세 내역 영역 */}
            <div className="fade-in">
              {viewMode === 'emoji' ? (
                <div>
                  <div className="flex items-center mb-6">
                    <div className="bg-[#333333] text-white px-3 py-1.5 rounded-full text-[11px] font-bold tracking-wide">
                      April {selectedDate}, 2026
                    </div>
                    <div className="flex-1 h-[1px] bg-black ml-3"></div>
                  </div>

                  <div className="space-y-4 px-2">
                    {dailyTransactions.map((tx, idx) => (
                      <div key={idx} className="flex items-center justify-between">
                        <div className="flex gap-4">
                          <span className="text-[11px] text-gray-400 w-10">{tx.time}</span>
                          <span className="text-[12px] font-medium text-black">{tx.name}</span>
                        </div>
                        <span className="text-[12px] font-bold text-black">{tx.amount}</span>
                      </div>
                    ))}
                  </div>

                  {/* 전체 내역 더보기 버튼 -> list.html 로 연결 */}
                  <button 
                    onClick={() => window.location.href = 'list.html'} 
                    className="w-full text-center mt-8 text-[11px] text-gray-500 font-medium flex items-center justify-center active:text-black transition"
                  >
                    전체 내역 더보기 
                    <svg className="w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
                  </button>
                </div>
              ) : (
                <div>
                  <div className="flex justify-between items-end border-b border-black pb-3 mb-6">
                    <div className="bg-[#474747] text-white px-3 py-1 rounded-md text-[11px] font-bold">정기적 지출 예상</div>
                    <div className="text-[18px] font-bold text-black">122,500원</div>
                  </div>

                  <div className="space-y-4 px-2">
                    {subscriptions.map((sub, idx) => (
                      <div key={idx} className="flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 bg-[#EEEEEE] rounded-lg"></div>
                          <span className="text-[12px] font-medium text-black">{sub.name}</span>
                        </div>
                        <span className="text-[12px] font-bold text-black">{sub.amount}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>

          </div>

          {/* ★ 하단 네비게이션: 2번째 탭인 history 활성화 ★ */}
          <BottomNav active="history" />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<HistoryApp />);
  </script>
</body>
</html>
