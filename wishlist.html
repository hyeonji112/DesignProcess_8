<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>위시리스트</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css">
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', 'sans-serif'] },
          colors: { primary: '#000000', brand: '#10B981', cardBg: '#EEEEEE' },
          animation: {
            'slide-up-modal': 'slideUpModal 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards'
          },
          keyframes: {
            slideUpModal: {
              from: { transform: 'translateY(20px) scale(0.95)', opacity: 0 },
              to: { transform: 'translateY(0) scale(1)', opacity: 1 }
            }
          }
        }
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components.js"></script>

  <script type="text/babel">
    const { useState } = React;

    const WishlistApp = () => {
      // 카메라 업로드 모달 상태
      const [isCameraModalOpen, setIsCameraModalOpen] = useState(false);

      // 가격 비교 데이터
      const priceHistory = [
        { label: "3달 전", price: "72,000원" },
        { label: "1달 전", price: "74,800원" },
        { label: "어제", price: "68,000원" }
      ];

      // 하단 위시리스트 목록 데이터
      const wishlistItems = [
        { id: 1, name: "오리지날 플레이 숏 레인부츠 - 블랙", price: "134,480" },
        { id: 2, name: "Peony & Blush Suede Cologne", price: "168,000" },
        { id: 3, name: "글린트 하이라이터 기획", price: "23,000" }
      ];

      // 검색창 & 카메라 버튼 컴포넌트
      const SearchBar = () => (
        <div className="px-6 py-2 mb-6 flex items-center gap-3">
          <div className="flex-1 bg-[#F5F5F5] rounded-full h-11 flex items-center px-4">
            <svg className="w-4 h-4 text-gray-400 mr-2 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input type="text" placeholder="link" className="bg-transparent border-none outline-none text-[13px] w-full" />
          </div>
          <button 
            onClick={() => setIsCameraModalOpen(true)}
            className="w-11 h-11 bg-black text-white rounded-full flex items-center justify-center shrink-0 active:scale-95 transition shadow-md"
          >
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          </button>
        </div>
      );

      return (
        <div className="device-mockup">
          
          {/* 상단 헤더 영역 */}
          <div className="sticky top-0 z-30 bg-white">
            <StatusBar />
            <div className="px-4 py-3 flex items-center">
              <button className="p-2 active:opacity-50">
                <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7"></path></svg>
              </button>
              <h1 className="text-[18px] font-bold ml-1 tracking-wide uppercase">WISH LIST</h1>
            </div>
          </div>

          {/* 본문 영역 */}
          <div className="app-content pb-[100px] bg-white relative">
            
            {/* 검색바 */}
            <SearchBar />

            {/* 메인 뷰 (업데이트된 가격 비교 및 이미지 레이아웃) */}
            <div className="fade-in px-6">
              
              <p className="text-center text-[12px] font-medium text-black mb-4">최근 3개월간 가장 낮은 가격이에요!</p>
              
              {/* 메인 상품 이미지 (.jpeg 적용 및 비율 유지) */}
              <div className="w-full aspect-[4/3] bg-[#F5F5F5] rounded-[24px] mb-5 overflow-hidden relative shadow-[inset_0_2px_4px_rgba(0,0,0,0.05)] border border-gray-100">
                <img 
                  src="img/004.jpeg" 
                  alt="메인 위시 아이템" 
                  className="w-full h-full object-cover" 
                  onError={(e) => { e.target.style.display = 'none'; }} 
                />
              </div>
              
              <h2 className="text-center text-[14px] font-bold text-black mb-6">(W) 아디다스 삼바 OG 클라우드 화이트 원더 쿼츠</h2>

              {/* 가격 히스토리 3구역 */}
              <div className="grid grid-cols-3 gap-3 mb-6">
                {priceHistory.map((h, i) => (
                  <div key={i} className="bg-white border border-gray-100 rounded-xl p-4 shadow-[0_2px_8px_rgba(0,0,0,0.04)] text-center flex flex-col justify-center">
                    <p className="text-[12px] text-gray-700 font-medium mb-1.5">{h.label}</p>
                    <p className="text-[13px] font-bold text-black">{h.price}</p>
                  </div>
                ))}
              </div>

              {/* ★ collect.html(돈 모으기 페이지)로 이동하는 버튼 ★ */}
              <button 
                onClick={() => window.location.href = 'collect.html'}
                className="w-full bg-[#333333] text-white font-bold py-4 rounded-xl mb-10 active:scale-[0.98] transition shadow-md flex items-center justify-center gap-2"
              >
                이 상품을 위해 돈 모으기 <span className="text-lg leading-none">🪙</span>
              </button>

              {/* 하단 리스트 영역 */}
              <div className="space-y-4">
                {wishlistItems.map((item) => (
                  <div key={item.id} className="flex items-center gap-4 cursor-pointer active:scale-[0.98] transition">
                    
                    {/* 와이어프레임 스타일의 썸네일 박스 */}
                    <div className="w-[88px] h-[88px] bg-white rounded-2xl shadow-[0_2px_10px_rgba(0,0,0,0.05)] border border-gray-50 relative shrink-0">
                      {/* 상단 우측 하트 아이콘 */}
                      <button className="absolute top-2 right-2 p-1">
                        <svg className="w-4 h-4 text-black" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                      </button>
                      {/* 하단 좌측 휴지통 아이콘 */}
                      <button className="absolute bottom-2 left-2 p-1.5 bg-[#EEEEEE] rounded-full">
                        <svg className="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                      </button>
                    </div>
                    
                    {/* 상품 정보 우측 정렬 */}
                    <div className="flex-1 flex flex-col justify-center text-right pr-2">
                      <p className="text-[12px] font-medium text-black leading-snug line-clamp-2 mb-2">{item.name}</p>
                      <p className="text-[15px] font-bold text-black">{item.price}</p>
                    </div>

                  </div>
                ))}
              </div>

            </div>

          </div>

          {/* 카메라 이미지 인식 팝업 모달 */}
          {isCameraModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              <div className="absolute inset-0 bg-black/60 backdrop-blur-[2px] transition-opacity" onClick={() => setIsCameraModalOpen(false)}></div>
              
              <div className="bg-white w-full max-w-[340px] rounded-[24px] shadow-2xl relative z-10 animate-slide-up-modal overflow-hidden flex flex-col">
                <div className="p-6 pt-8">
                  
                  <div className="w-full aspect-[4/3] bg-[#F5F5F5] rounded-lg border border-gray-200 relative mb-5 flex items-center justify-center overflow-hidden">
                    <img src="img/003.jpg" alt="인식된 이미지" className="w-full h-full object-cover" onError={(e) => { e.target.style.display = 'none'; }} />
                    <svg className="hidden absolute inset-0 w-full h-full opacity-30 pointer-events-none" preserveAspectRatio="none" viewBox="0 0 100 100"><line x1="0" y1="0" x2="100" y2="100" stroke="#545F71" strokeWidth="0.5" /><line x1="100" y1="0" x2="0" y2="100" stroke="#545F71" strokeWidth="0.5" /></svg>
                  </div>

                  <div className="mb-6">
                    <h2 className="text-[13px] font-medium text-black leading-snug mb-1">[WOMEN] 오리지날 플레이 숏 레인부츠 - 블랙</h2>
                    <span className="text-gray-400 text-[11px] block mb-2">WFS2020RMABLK</span>
                    <div className="flex items-center gap-1 text-[11px] text-gray-500 mb-3">
                      <span className="text-[#FF9900]">★</span><span className="font-bold text-[#FF9900]">4.9</span><span>26</span>
                    </div>
                    
                    <div className="bg-[#FAFAFA] p-3 rounded-xl text-right border border-gray-100">
                      <span className="text-[11px] text-gray-400 line-through mr-1">149,000원</span><br/>
                      <span className="text-[14px] font-bold text-[#FF3B30] mr-1">10%</span>
                      <span className="text-[16px] font-bold text-black">134,480원</span>
                    </div>
                  </div>

                  <div className="flex gap-2">
                    <button 
                      onClick={() => setIsCameraModalOpen(false)} 
                      className="flex-1 py-3.5 border border-gray-300 rounded-[12px] text-[13px] font-bold text-black active:bg-gray-100 transition"
                    >
                      다시찍기
                    </button>
                    <button 
                      onClick={() => setIsCameraModalOpen(false)} 
                      className="flex-1 py-3.5 border border-gray-300 rounded-[12px] text-[13px] font-bold text-black active:bg-gray-100 transition"
                    >
                      확인
                    </button>
                  </div>
                  
                </div>
              </div>
            </div>
          )}

          {/* 하단 네비게이션: 4번째 하트 아이콘 활성화 */}
          <BottomNav active="wishlist" />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<WishlistApp />);
  </script>
</body>
</html>
