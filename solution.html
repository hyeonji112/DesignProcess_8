<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>솔루션</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css">
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', 'sans-serif'] },
          colors: { primary: '#000000', brand: '#10B981', cardBg: '#EEEEEE' },
          animation: {
            'float-slow': 'float 3s ease-in-out infinite',
            'float-fast': 'float 2s ease-in-out infinite reverse',
            'slide-up-modal': 'slideUpModal 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards'
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            slideUpModal: {
              from: { transform: 'translateY(20px) scale(0.95)', opacity: 0 },
              to: { transform: 'translateY(0) scale(1)', opacity: 1 }
            }
          }
        }
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components.js"></script>

  <script type="text/babel">
    const { useState } = React;

    const SolutionApp = () => {
      // 선택된 팁을 저장하는 상태 (null이면 모달 닫힘)
      const [selectedTip, setSelectedTip] = useState(null);

      // 다른 사용자 팁 상세 데이터 (이미지 경로 추가)
      const userTips = [
        { 
          id: "아름다운아나콘다1234", 
          summary: "밤에는 절대 구매까지 안가고 장바구니에만 넣어둬요. 제정신 아닐때라...",
          detail: "밤에는 절대 구매까지 안가고 장바구니에만 넣어둬요. 제정신 아닐때라 쉽게 이상한걸 많이 구매하게 되거든요. 아무리 급해도 내일 아침까지는 미루는 편이죠. 건강한 미룸이 이런거 아닐까요? 요즘 이러다보니 미니멀리스트 소리까지 들을 수준이에요.",
          image: "img/001.jpeg"
        },
        { 
          id: "다이소에다있소5678", 
          summary: "저녁 먹고 다음부터는 절대 안보는게 정답이라고 생각해요. 저는 그래서...",
          detail: "저녁 먹고 다음부터는 절대 쇼핑앱을 안보는게 정답이라고 생각해요. 저는 그래서 저녁 8시 이후에는 모든 쇼핑앱 알림을 꺼두고, 화면 흑백 모드를 켭니다. 시각적인 자극을 줄이는 것만으로도 충동구매가 확 줄어들어요!",
          image: "img/002.jpeg"
        },
        { 
          id: "자유로운원숭이9101", 
          summary: "구매하기 전에 물 한잔 마시고 고민하면 좀 더 제대로 된 구매를 할 수 있...",
          detail: "구매버튼 누르기 전에 시원한 물 한잔 마시고 10분만 고민해보세요. 순간적인 스트레스 때문에 생긴 가짜 식욕처럼, 가짜 소비욕도 물 한 잔 마시고 심호흡하면 꽤 많이 가라앉는답니다.",
          image: "img/003.jpeg"
        }
      ];

      // 맞춤 아티클 더미 데이터
      const articles = [
        { title: "야작할 때 폭발하는\n야식비 방어하는 법", emoji: "🍕" },
        { title: "과제용 디자인 툴\n구독료 똑똑하게 쉐어하기", emoji: "💻" },
        { title: "보부상 대학생의\n가성비 백팩 추천", emoji: "🎒" }
      ];

      return (
        <div className="device-mockup">
          
          {/* 상단 헤더 영역 */}
          <div className="sticky top-0 z-30 bg-white">
            <StatusBar />
            <div className="px-4 py-3 flex items-center border-b border-gray-100">
              <button className="p-2 active:opacity-50">
                <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7"></path></svg>
              </button>
              <h1 className="text-[20px] font-bold ml-2 tracking-wide uppercase">Solution</h1>
            </div>
          </div>

          {/* 스크롤 가능한 본문 영역 */}
          <div className="app-content p-6 pb-[100px] bg-white fade-in relative z-10">
            
            {/* 1. 감정 및 소비 패턴 분석 카드 */}
            <div className="bg-[#FAFAFA] rounded-[20px] p-6 shadow-[inset_0_1px_4px_rgba(0,0,0,0.03)] border border-gray-100 mb-10 text-center relative overflow-hidden">
              <div className="flex justify-center items-center h-[120px] relative mb-4 mt-2">
                <div className="absolute -ml-[80px] -mt-[60px] text-4xl animate-float-slow opacity-90">😵</div>
                <div className="z-10 text-[70px] filter drop-shadow-md transform hover:scale-105 transition duration-300">🤯</div>
                <div className="absolute ml-[90px] mt-[40px] text-3xl animate-float-fast opacity-90">😍</div>
                <div className="absolute -ml-[70px] mt-[50px] text-4xl animate-float-slow opacity-80" style={{ animationDelay: '1s' }}>😢</div>
              </div>
              
              <p className="text-[14px] text-gray-800 leading-relaxed mb-3">
                이번 주 현지님은<br/>
                <strong className="text-[18px] font-extrabold text-black tracking-tight">밤 11시 + 스트레스</strong> 시에<br/>씀씀이가 가장 컸어요.
              </p>
              <p className="text-[10px] text-gray-400 leading-relaxed max-w-[260px] mx-auto break-keep">
                마음이 허전할 때 무언가를 사서 채우려던 흔적들이 보여요. 다음 주엔 밤에 우울함이 찾아오면, 쇼핑 앱 대신 좋아하는 음악으로 기분을 달래보는 건 어떨까요?
              </p>
            </div>

            {/* 2. 유혹 극복 팁 섹션 */}
            <div className="mb-12">
              <h3 className="text-[13px] text-gray-600 font-medium mb-1">밤 11시에 유혹을 이겨내기 힘든</h3>
              <div className="flex items-center justify-between mb-5">
                <h2 className="text-[22px] font-bold text-black tracking-tight">#선결제_후수습을 위한 팁!</h2>
                <button className="p-1 text-black"><svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"></path></svg></button>
              </div>
              
              <div className="bg-[#FAFAFA] rounded-[20px] p-5 border border-gray-100 relative">
                <h4 className="text-[14px] font-bold text-black mb-4 flex items-center">
                  다른 사용자들은 이렇게 하고 있어요! <span className="ml-1 text-lg">💡</span>
                </h4>
                
                <div className="space-y-3 relative z-10">
                  {userTips.map((tip, idx) => (
                    <div 
                      key={idx} 
                      onClick={() => setSelectedTip(tip)}
                      className="bg-white rounded-xl p-4 shadow-sm border border-gray-50 cursor-pointer hover:border-black active:scale-[0.98] transition"
                    >
                      <span className="text-[10px] font-semibold text-gray-400 mb-1.5 block">{tip.id}# 님</span>
                      <p className="text-[12px] text-gray-800 leading-snug">{tip.summary}</p>
                    </div>
                  ))}
                </div>
                
                {/* 슬라이더 삭제 및 텍스트 더보기 버튼으로 변경 */}
                <div className="flex justify-end mt-4">
                  <button className="text-[12px] font-bold text-gray-500 hover:text-black transition flex items-center">
                    더보기 
                    <svg className="w-3.5 h-3.5 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M9 5l7 7-7 7"></path></svg>
                  </button>
                </div>
              </div>
            </div>

            {/* 3. 맞춤형 정보(아티클) 섹션 */}
            <div>
              <h2 className="text-[18px] font-bold text-black leading-snug mb-4 tracking-tight">
                현지님과 비슷한 20대 대학생들은<br/>이렇게 돈 관리를 한대요!
              </h2>
              
              <div className="flex overflow-x-auto gap-4 pb-4 snap-x app-content -mx-6 px-6">
                {articles.map((article, idx) => (
                  <div key={idx} className="min-w-[140px] h-[180px] bg-[#EEEEEE] rounded-[16px] p-4 flex flex-col justify-between snap-start cursor-pointer hover:bg-[#E5E5E5] transition active:scale-[0.98]">
                    <span className="text-3xl mt-2">{article.emoji}</span>
                    <h3 className="text-[13px] font-bold text-black leading-snug whitespace-pre-line">
                      {article.title}
                    </h3>
                  </div>
                ))}
                <div className="min-w-[4px]"></div>
              </div>
            </div>

          </div>

          {/* ★ 상세 팁 팝업 모달 ★ */}
          {selectedTip && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
              {/* 반투명 배경 (클릭 시 닫힘) */}
              <div 
                className="absolute inset-0 bg-black/60 backdrop-blur-[2px] transition-opacity"
                onClick={() => setSelectedTip(null)}
              ></div>
              
              {/* 모달 콘텐츠 */}
              <div className="bg-white w-full max-w-[340px] rounded-[24px] shadow-2xl relative z-10 animate-slide-up-modal overflow-hidden flex flex-col max-h-[85vh]">
                
                {/* 팝업 헤더 */}
                <div className="flex items-center px-5 py-4">
                  <button onClick={() => setSelectedTip(null)} className="p-1 mr-2 active:opacity-50">
                    <svg width="22" height="22" fill="none" stroke="currentColor" strokeWidth="3" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7"></path></svg>
                  </button>
                  <h2 className="text-[18px] font-bold text-black truncate flex-1 text-center">#선결제_후수습을 위한 팁!</h2>
                  <div className="w-8"></div>
                </div>

                <div className="p-5 pt-2 overflow-y-auto app-content">
                  {/* 작성자 & 하트 */}
                  <div className="flex justify-between items-center mb-4">
                    <span className="text-[13px] font-medium text-gray-800">{selectedTip.id}# 님</span>
                    <button className="text-gray-400 hover:text-red-500 transition active:scale-90">
                      <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                    </button>
                  </div>

                  {/* ★ X 플레이스홀더 대신 실제 이미지 적용 ★ */}
                  <div className="w-full aspect-[4/3] bg-[#F8F9FA] rounded-lg relative mb-5 overflow-hidden shadow-inner">
                    <img 
                      src={selectedTip.image} 
                      alt="팁 사용자 이미지" 
                      className="w-full h-full object-cover"
                      onError={(e) => {
                        // 이미지가 없을 경우를 대비한 엑스박스 백폴
                        e.target.style.display = 'none';
                        e.target.nextSibling.style.display = 'block';
                      }}
                    />
                    {/* 이미지 로드 실패 시 나타날 백폴 SVG */}
                    <svg className="hidden absolute inset-0 w-full h-full opacity-40 pointer-events-none" preserveAspectRatio="none" viewBox="0 0 100 100">
                      <line x1="0" y1="0" x2="100" y2="100" stroke="#545F71" strokeWidth="0.5" />
                      <line x1="100" y1="0" x2="0" y2="100" stroke="#545F71" strokeWidth="0.5" />
                    </svg>
                  </div>

                  {/* 상세 텍스트 */}
                  <div className="bg-[#FAFAFA] rounded-xl p-5 mb-8 border border-gray-100">
                    <p className="text-[13px] text-gray-800 leading-relaxed break-keep">
                      {selectedTip.detail}
                    </p>
                  </div>

                  {/* 피드백 버튼 */}
                  <div className="text-center pb-2">
                    <p className="text-[13px] text-gray-600 mb-4 font-medium">도움이 되었나요?</p>
                    <div className="flex gap-3">
                      <button 
                        onClick={() => setSelectedTip(null)} 
                        className="flex-1 py-3.5 border border-gray-300 rounded-xl text-[13px] font-bold text-black active:bg-gray-100 transition"
                      >
                        아니예요
                      </button>
                      <button 
                        onClick={() => setSelectedTip(null)} 
                        className="flex-1 py-3.5 border border-gray-300 rounded-xl text-[13px] font-bold text-black active:bg-gray-100 transition"
                      >
                        네
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 하단 네비게이션: 3번째 탭인 solution 활성화 */}
          <BottomNav active="solution" />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SolutionApp />);
  </script>
</body>
</html>
