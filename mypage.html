<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>마이페이지</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css">
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Pretendard', 'sans-serif'] },
          colors: { primary: '#000000', brand: '#10B981', cardBg: '#EEEEEE' }
        }
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="components.js"></script>

  <script type="text/babel">
    const { useState } = React;

    const MyPageApp = () => {
      // 마이페이지 리스트 메뉴 데이터 설정
      const menuData = [
        {
          category: "앱 설정",
          items: [
            { label: "나의 소비 함정 설정" },
            { label: "목표 관리" },
            { label: "시작 화면 설정" },
            { label: "다크모드 설정" },
            { label: "알림 설정" },
            { label: "암호 잠금 설정" }
          ]
        },
        {
          category: "이용안내",
          items: [
            { label: "문의하기(고객센터)", value: "08:00~18:00" },
            { label: "서비스 이용약관" },
            { label: "개인정보 처리 방침" },
            { label: "오픈소스 라이선스" },
            { label: "공지사항" },
            { label: "1:1 문의 내역" }
          ]
        },
        {
          category: "기타",
          items: [
            { label: "정보 동의 설정" },
            { label: "회원 탈퇴" },
            { label: "캐시 삭제" },
            { label: "로그아웃" }
          ]
        }
      ];

      return (
        <div className="device-mockup">
          
          {/* 상단 고정 헤더 영역 */}
          <div className="sticky top-0 z-30 bg-white">
            <StatusBar />
            <div className="px-4 py-3 flex items-center border-b border-gray-100">
              <button onClick={() => window.history.back()} className="p-2 active:opacity-50 transition">
                <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7"></path></svg>
              </button>
              <h1 className="text-[16px] font-bold ml-1 tracking-wide uppercase">MY PAGE</h1>
            </div>
          </div>

          {/* 스크롤 가능한 본문 영역 */}
          <div className="app-content pb-[100px] bg-white fade-in">
            
            {/* 프로필 섹션 */}
            <div className="px-6 py-7 flex justify-between items-center bg-white">
              <div>
                <p className="text-[12px] font-medium text-gray-400 mb-0.5">Welcome</p>
                <p className="text-[22px] font-bold text-black tracking-tight">현지님</p>
              </div>
              <button className="flex items-center text-[15px] text-black font-medium active:opacity-50 transition">
                회원정보
                <svg className="w-4 h-4 text-gray-400 ml-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
              </button>
            </div>

            {/* 두꺼운 구분선 */}
            <div className="w-full h-3 bg-[#E5E5E5] opacity-60"></div>

            {/* 메뉴 리스트 섹션 */}
            <div className="bg-white">
              {menuData.map((section, idx) => (
                <div key={idx}>
                  {/* 첫 번째 섹션이 아닐 때 얇은 구분선 추가 */}
                  {idx > 0 && <div className="w-full h-[1px] bg-gray-100"></div>}
                  
                  <div className="px-6 py-2">
                    <h2 className="text-[12px] font-bold text-[#B0B0B0] pt-4 pb-2">
                      {section.category}
                    </h2>
                    
                    <ul className="flex flex-col">
                      {section.items.map((item, i) => (
                        <li 
                          key={i} 
                          className="py-4 flex justify-between items-center cursor-pointer active:bg-gray-50 transition -mx-6 px-6"
                        >
                          <span className="text-[15px] font-medium text-[#111111] tracking-tight">{item.label}</span>
                          {/* 우측에 추가 정보(예: 운영시간)가 있는 경우 렌더링 */}
                          {item.value && (
                            <span className="text-[13px] font-medium text-[#A0A0A0]">{item.value}</span>
                          )}
                        </li>
                      ))}
                    </ul>
                  </div>
                </div>
              ))}
            </div>

          </div>

          {/* 하단 네비게이션: 5번째 탭인 mypage 활성화 */}
          <BottomNav active="mypage" />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MyPageApp />);
  </script>
</body>
</html>
